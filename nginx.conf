server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s;

  root /usr/share/nginx/html;
  index index.html;

  # Cache immutable hashed frontend assets for one year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache service worker or app metadata.
  location ~* (sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest|version\.json)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, must-revalidate";
    try_files $uri =404;
  }

  location /api/ {
    set $upstream ${API_UPSTREAM_URL};
    proxy_pass http://$upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single page app fallback; do not cache index.html.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri $uri/ /index.html;
  }
}
