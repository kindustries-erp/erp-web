name: Pipeline Web — erp-greenway-production via Komodo Elite

on:
  push:
    branches: [erp-greenway-production]
  pull_request:
    branches: [erp-greenway-production]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kindustries-erp/erp-web-greenway-production
  KOMODO_WEB_STACK: erp-greenway-production-elite-web
  ELITE_WEB_URL: http://100.75.67.115:8014
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    name: Lint, Type & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run check:ci
      - run: bun run test
      - run: bun run build

  build-and-push:
    name: Build & Push immutable Web image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_APP_NAME=${{ vars.GREENWAY_PRODUCTION_WEB_APP_NAME }}
            VITE_API_BASE_URL=http://100.75.67.115:10014
            APP_ENV=greenway-production-elite
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Web through Komodo to Elite
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    steps:
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - name: Guard Komodo deployment configuration
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_URL: ${{ vars.KOMODO_URL }}
        run: |
          set -euo pipefail
          test -n "$KOMODO_API_KEY"
          test -n "$KOMODO_API_SECRET"
          test -n "$KOMODO_URL"
      - name: Update immutable Web image reference
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_URL: ${{ vars.KOMODO_URL }}
          IMAGE_SHA: ${{ needs.build-and-push.outputs.sha }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${IMAGE_SHA}"
          payload="$(jq -n \
            --arg stack "$KOMODO_WEB_STACK" \
            --arg contents "ERP_GREENWAY_WEB_IMAGE=$image"$'\n' \
            '{stack: $stack, file_path: ".env", contents: $contents}')"
          curl --fail-with-body --silent --show-error \
            -X POST "$KOMODO_URL/write/WriteStackFileContents" \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null
      - name: Pull and deploy Web through Komodo
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_URL: ${{ vars.KOMODO_URL }}
        run: |
          set -euo pipefail
          for path in PullStack DeployStack; do
            payload="$(jq -n --arg stack "$KOMODO_WEB_STACK" '{stack: $stack}')"
            curl --fail-with-body --silent --show-error \
              -X POST "$KOMODO_URL/execute/$path" \
              -H "X-Api-Key: $KOMODO_API_KEY" \
              -H "X-Api-Secret: $KOMODO_API_SECRET" \
              -H 'Content-Type: application/json' \
              --data "$payload" >/dev/null
          done
      - name: Verify Web on Elite Tailscale endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            code="$(curl --connect-timeout 10 --silent --output /dev/null --write-out '%{http_code}' "$ELITE_WEB_URL/" || true)"
            if [ "$code" = 200 ]; then
              echo "Web healthy: HTTP $code"
              exit 0
            fi
            echo "Web attempt $i/36: HTTP $code"; sleep 5
          done
          exit 1
