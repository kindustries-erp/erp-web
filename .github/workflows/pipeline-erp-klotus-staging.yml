name: Pipeline Web — erp-klotus-staging

on:
  push:
    branches:
      - erp-klotus-staging
  pull_request:
    branches:
      - erp-klotus-staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kindustries-erp/erp-web-klotus-staging
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    name: Lint, Type & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (type + lint + prettier)
        run: bun run check:ci

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_APP_NAME=${{ vars.KLOTUS_STAGING_WEB_APP_NAME }}
            VITE_API_BASE_URL=${{ vars.KLOTUS_STAGING_WEB_API_BASE_URL }}
            APP_ENV=klotus-staging
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Elite
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ELITE_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Guard deploy secrets
        run: |
          test -n "${{ secrets.GHCR_PAT }}" || (echo "GHCR_PAT missing" && exit 1)

      - name: Run deploy script
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -p ${{ vars.ELITE_PORT }} \
            ${{ vars.ELITE_USER }}@${{ vars.ELITE_HOST }} \
            "echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin ; \
             docker pull ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.sha }} || true ; \
             docker rm -f erp-web-klotus-staging || true ; \
             docker run -d --name erp-web-klotus-staging --restart always --add-host erp-api-master:host-gateway --add-host erp-api-klotus-staging:host-gateway -p 8011:80 ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.sha }}"

      - name: Health check
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -p ${{ vars.ELITE_PORT }} \
            ${{ vars.ELITE_USER }}@${{ vars.ELITE_HOST }} \
            '
              for i in $(seq 1 60); do
                code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8011/ || true)
                if [ "$code" = "200" ]; then
                  echo "✅ Web health OK"
                  docker image prune -af
                  exit 0
                fi
                echo "Attempt $i: got $code, retrying..."
                sleep 3
              done
              echo "❌ Health check failed"
              exit 1
            '
