name: Pipeline Web — erp-klotus-production via Komodo

on:
  push:
    branches: [erp-klotus-production]
  workflow_dispatch:
  pull_request:
    branches: [erp-klotus-production]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kindustries-erp/erp-web-klotus-production
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    name: Lint, Type & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:ci
      - run: bun run test
      - run: bun run build

  build-and-push:
    name: Build & Push immutable Web image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_APP_NAME=${{ vars.KLOTUS_PRODUCTION_WEB_APP_NAME || 'Klotus ERP' }}
            VITE_API_BASE_URL=
            APP_ENV=production
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ matrix.target.host }} (${{ matrix.target.ip }})
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        target:
          - host: elite
            server_name: ELITE
            ip: 100.75.67.115
            port: 8016
    env:
      KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
      KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
      KOMODO_URL: ${{ vars.KOMODO_URL }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - name: Guard Komodo deployment configuration
        run: |
          set -euo pipefail
          test -n "$KOMODO_API_KEY"
          test -n "$KOMODO_API_SECRET"
          test -n "$KOMODO_URL"

      - name: Ensure Komodo Web Stack (Auto-Provisioning)
        id: provision
        env:
          TARGET_HOST: ${{ matrix.target.host }}
          SERVER_NAME: ${{ matrix.target.server_name }}
          TARGET_IP: ${{ matrix.target.ip }}
          TARGET_PORT: ${{ matrix.target.port }}
        run: |
          set -euo pipefail
          call() {
            curl --fail-with-body --silent --show-error -X POST "$KOMODO_URL$1" \
              -H "X-Api-Key: $KOMODO_API_KEY" -H "X-Api-Secret: $KOMODO_API_SECRET" \
              -H 'Content-Type: application/json' --data "$2"
          }

          web_stack="${BRANCH}-${TARGET_HOST}-web"
          api_stack="${BRANCH}-${TARGET_HOST}-api"
          upstream_service="${api_stack}-api-1:3000"
          echo "web_stack=$web_stack" >> "$GITHUB_OUTPUT"

          # 1. Resolve Server ID from Komodo
          servers="$(call /read/ListServers '{}')"
          server_id="$(jq -r --arg sname "$SERVER_NAME" '.[] | select(.name | ascii_downcase == ($sname | ascii_downcase)) | .id' <<<"$servers")"
          if [ -z "$server_id" ]; then
            echo "Error: Server $SERVER_NAME not found in Komodo" >&2
            exit 1
          fi
          echo "Resolved Server $SERVER_NAME -> $server_id"

          # 2. Compose contents
          web_compose="$(sed -e "s/__TARGET_IP__/$TARGET_IP/g" -e "s/__TARGET_PORT__/$TARGET_PORT/g" -e "s/__UPSTREAM_SERVICE__/$upstream_service/g" .github/compose/web.compose.yaml)"

          # 3. Ensure Stack exists
          stack_info="$(call /read/GetStack "$(jq -nc --arg stack "$web_stack" '{stack:$stack}')" 2>/dev/null || true)"
          sid_found="$(jq -r '._id."$oid" // .id // empty' <<<"$stack_info")"

          if [ -z "$sid_found" ]; then
            echo "Creating stack $web_stack..."
            create_resp="$(call /write/CreateStack "$(jq -nc --arg name "$web_stack" '{name:$name}')")"
            sid_found="$(jq -r '._id."$oid" // .id // empty' <<<"$create_resp")"
          fi

          echo "Configuring stack $web_stack (ID: $sid_found)..."
          call /write/UpdateStack "$(jq -nc --arg id "$sid_found" --arg sid "$server_id" --arg run_dir "/opt/stacks/$web_stack" \
            '{id:$id, config:{server_id:$sid, files_on_host:true, run_directory:$run_dir, file_paths:["compose.yaml"], env_file_path:".env", auto_pull:true}}')" >/dev/null

          call /write/WriteStackFileContents "$(jq -nc --arg stack "$web_stack" --arg contents "$web_compose" \
            '{stack:$stack, file_path:"compose.yaml", contents:$contents}')" >/dev/null

      - name: Update immutable Web image reference
        env:
          IMAGE_SHA: ${{ needs.build-and-push.outputs.sha }}
          WEB_STACK: ${{ steps.provision.outputs.web_stack }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${IMAGE_SHA}"
          payload="$(jq -n \
            --arg stack "$WEB_STACK" \
            --arg contents "ERP_WEB_IMAGE=$image"$'\n' \
            '{stack: $stack, file_path: ".env", contents: $contents}')"
          curl --fail-with-body --silent --show-error \
            -X POST "$KOMODO_URL/write/WriteStackFileContents" \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null

      - name: Pull and deploy Web through Komodo
        env:
          WEB_STACK: ${{ steps.provision.outputs.web_stack }}
        run: |
          set -euo pipefail
          for path in PullStack DeployStack; do
            payload="$(jq -n --arg stack "$WEB_STACK" '{stack: $stack}')"
            curl --fail-with-body --silent --show-error \
              -X POST "$KOMODO_URL/execute/$path" \
              -H "X-Api-Key: $KOMODO_API_KEY" \
              -H "X-Api-Secret: $KOMODO_API_SECRET" \
              -H 'Content-Type: application/json' \
              --data "$payload" >/dev/null
          done

      - name: Verify Web on Tailscale endpoint
        run: |
          set -euo pipefail
          url="http://${{ matrix.target.ip }}:${{ matrix.target.port }}"
          for i in $(seq 1 36); do
            code="$(curl --connect-timeout 10 --silent --output /dev/null --write-out '%{http_code}' "$url/" || true)"
            if [ "$code" = 200 ]; then
              echo "Web healthy: HTTP $code"
              exit 0
            fi
            echo "Web attempt $i/36: HTTP $code"
            sleep 5
          done
          exit 1
