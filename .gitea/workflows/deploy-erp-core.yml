name: Deploy ERP Web erp-core
on:
  push:
    branches: [erp-core]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          DEPLOY_KEY_RAW="${{ secrets.DEPLOY_KEY }}"
          if [ -z "$DEPLOY_KEY_RAW" ]; then
            echo "ERROR: DEPLOY_KEY secret is empty or missing"
            exit 1
          fi
          if printf '%s' "$DEPLOY_KEY_RAW" | base64 -d > ~/.ssh/id_ed25519 2>/dev/null \
             && chmod 600 ~/.ssh/id_ed25519 \
             && ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "DEPLOY_KEY decoded as base64"
          else
            printf '%b' "$DEPLOY_KEY_RAW" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          fi
          ssh-keyscan -H 100.75.67.115 >> ~/.ssh/known_hosts
      - name: Deploy Web on Elite
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes lio@100.75.67.115 'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/repos/liouni-erp-core/liouni-erp-web
          git fetch origin
          git checkout erp-core
          git reset --hard origin/erp-core

          cd /opt/stacks/liouni-erp-core-web
          docker compose build
          docker compose create --force-recreate
          docker compose start
          docker compose ps

          for i in $(seq 1 30); do
            web_status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8809/ || true)
            if [ "$web_status" = "200" ]; then
              echo "Web health OK (200)"
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          echo "Web health check failed"
          docker compose ps || true
          docker logs --tail=100 liouni-erp-core-web || true
          exit 1
          EOF
