name: Deploy ERP Web Staging
on:
  push:
    branches: [staging]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy Web on Elite
        run: |
          ssh -p 26266 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no lio@100.90.103.19 '
            set -e
            cd /opt/repos/liouni-erp/liouni-erp-web
            git fetch origin
            git checkout staging
            git reset --hard origin/staging
            cd /opt/stacks/liouni-erp-web
            docker compose up -d --build
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8808/ || true)
              if [ "$code" = "200" ]; then
                echo "Web health OK (200)"
                exit 0
              fi
              sleep 2
            done
            echo "Web health check failed"
            exit 1
          '
